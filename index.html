<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quixot vs Molins - NeurekaLAB</title>
    
    <!-- Icona del Quixot per al mòbil -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/512/8b4513/don-quixote.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/512/8b4513/don-quixote.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #fef3c7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #joc-container { position: relative; height: 100vh; width: 100vw; display: flex; flex-direction: column; }
        
        /* Capçalera */
        header { 
            height: 70px; background: #1e293b; color: white; display: flex; 
            justify-content: space-between; align-items: center; padding: 0 20px; 
            box-sizing: border-box; z-index: 10; border-bottom: 3px solid #8b4513;
        }
        .stat-label { font-size: 9px; text-transform: uppercase; color: #94a3b8; font-weight: 800; letter-spacing: 1px; }
        .stat-val { font-size: 20px; font-weight: 900; color: #facc15; }

        /* Pantalla de joc */
        canvas { background-color: #bae6fd; flex-grow: 1; touch-action: none; }

        /* Peu de pàgina */
        footer { 
            position: absolute; bottom: 10px; width: 100%; text-align: center; 
            pointer-events: none; color: rgba(255,255,255,0.6); font-size: 10px; 
            font-weight: bold; text-transform: uppercase; letter-spacing: 2px;
        }

        /* Overlay Game Over */
        #game-over { 
            display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); 
            color: white; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 100; text-align: center; backdrop-filter: blur(5px);
        }
        .btn-restart { 
            background: #2563eb; color: white; border: none; padding: 15px 40px; 
            border-radius: 50px; font-weight: 900; font-size: 18px; cursor: pointer; 
            margin-top: 20px; box-shadow: 0 10px 0 #1e40af;
        }
    </style>
</head>
<body>

    <div id="joc-container">
        <header>
            <div><p class="stat-label">Punts</p><span id="val-punts" class="stat-val">0</span></div>
            <div id="val-vides" style="font-size: 22px;">❤️❤️❤️</div>
            <div style="text-align: right;"><p class="stat-label">Rècord</p><span id="val-record" class="stat-val">0</span></div>
        </header>

        <canvas id="jocCanvas"></canvas>

        <div id="game-over">
            <h2 style="font-size: 40px; margin: 0; font-style: italic; color: #f87171;">FINAL DE LA BATALLA</h2>
            <div style="margin: 20px 0; border: 1px solid #334155; padding: 20px; border-radius: 20px; background: rgba(255,255,255,0.05);">
                <p style="font-size: 12px; color: #94a3b8; margin: 0;">HAS ACONSEGUIT</p>
                <p id="punts-finals" style="font-size: 60px; font-weight: 900; margin: 5px 0;">0</p>
                <p id="txt-record" style="font-size: 12px; color: #fbbf24; display: none;">NOU RÈCORD!</p>
            </div>
            <button onclick="reiniciar()" class="btn-restart">TORNAR A CAVALCAR</button>
        </div>

        <footer>By NeurekaLAB</footer>
    </div>

    <script>
        const canvas = document.getElementById("jocCanvas");
        const ctx = canvas.getContext("2d");
        const overlay = document.getElementById("game-over");

        let puntuacio = 0;
        let vides = 3;
        let jocActiu = true;
        let record = localStorage.getItem("quixot_v4_record") || 0;
        document.getElementById("val-record").innerText = record;

        function ajustarMida() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 70;
        }
        window.addEventListener('resize', ajustarMida);
        ajustarMida();

        // Objectes
        const quixot = { x: canvas.width / 2, y: 0, w: 70, h: 70, vel: 0, targetX: canvas.width / 2 };
        let llances = [];
        let molins = [];
        let angleAspes = 0;

        // CONTROLS TÀCTILS (Toca esquerra per moure esquerra, dreta per moure dreta, mig per disparar)
        window.addEventListener('touchstart', (e) => {
            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;

            if (!jocActiu) return;

            if (touchY < window.innerHeight / 2) {
                disparar();
            } else {
                if (touchX < window.innerWidth / 2) {
                    quixot.vel = -8;
                } else {
                    quixot.vel = 8;
                }
            }
        });

        window.addEventListener('touchend', () => {
            quixot.vel = 0;
        });

        function disparar() {
            llances.push({ x: quixot.x + 30, y: quixot.y, w: 10, h: 40 });
        }

        // Dibuixar el Quixot (Imatge vectorial)
        function dibuixarQuixot(x, y) {
            ctx.save();
            ctx.translate(x, y);
            // Cavall
            ctx.fillStyle = "#5d4037";
            ctx.fillRect(10, 40, 40, 20); // cos
            ctx.fillRect(40, 25, 10, 20); // coll
            // Genet (Quixot)
            ctx.fillStyle = "#374151";
            ctx.fillRect(20, 15, 15, 25); // cos
            ctx.fillStyle = "#f3f4f6";
            ctx.beginPath();
            ctx.arc(27, 10, 8, 0, Math.PI * 2); // cap
            ctx.fill();
            // Llança
            ctx.strokeStyle = "#94a3b8";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(35, 25);
            ctx.lineTo(60, -10);
            ctx.stroke();
            ctx.restore();
        }

        // Dibuixar Molí de vent
        function dibuixarMoli(m) {
            ctx.save();
            ctx.translate(m.x + m.w/2, m.y + m.h/2);
            // Torre
            ctx.fillStyle = "#f5f5f5";
            ctx.beginPath();
            ctx.moveTo(-20, 25);
            ctx.lineTo(20, 25);
            ctx.lineTo(15, -20);
            ctx.lineTo(-15, -20);
            ctx.fill();
            ctx.fillStyle = "#8b4513";
            ctx.fillRect(-18, -25, 36, 10); // Teulada
            
            // Aspes girant
            ctx.rotate(angleAspes);
            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 4;
            for(let i=0; i<4; i++) {
                ctx.rotate(Math.PI/2);
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.lineTo(0, 30);
                ctx.stroke();
                ctx.fillStyle = "rgba(255,255,255,0.8)";
                ctx.fillRect(-5, 10, 10, 20);
            }
            ctx.restore();
        }

        function perdreVida() {
            vides--;
            document.getElementById("val-vides").innerText = "❤️".repeat(vides);
            if (vides <= 0) {
                jocActiu = false;
                if (puntuacio > record) {
                    record = puntuacio;
                    localStorage.setItem("quixot_v4_record", record);
                    document.getElementById("txt-record").style.display = "block";
                }
                document.getElementById("punts-finals").innerText = puntuacio;
                overlay.style.display = "flex";
            }
        }

        function reiniciar() {
            puntuacio = 0; vides = 3; llances = []; molins = [];
            document.getElementById("val-punts").innerText = "0";
            document.getElementById("val-vides").innerText = "❤️❤️❤️";
            document.getElementById("txt-record").style.display = "none";
            overlay.style.display = "none";
            jocActiu = true;
            bucle();
        }

        function bucle() {
            if (!jocActiu) return;

            quixot.y = canvas.height - 100;
            quixot.x += quixot.vel;
            if (quixot.x < 0) quixot.x = 0;
            if (quixot.x > canvas.width - 70) quixot.x = canvas.width - 70;

            angleAspes += 0.05;

            if (Math.random() < 0.025) {
                molins.push({ x: Math.random() * (canvas.width - 60), y: -100, w: 60, h: 80, v: 2.5 + Math.random() * 2.5 });
            }

            llances.forEach((l, i) => {
                l.y -= 10;
                if (l.y < -50) llances.splice(i, 1);
            });

            molins.forEach((m, i) => {
                m.y += m.v;
                if (m.y > canvas.height) molins.splice(i, 1);

                // Col·lisió Quixot
                if (m.y + m.h > quixot.y + 20 && m.x < quixot.x + quixot.w - 10 && m.x + m.w > quixot.x + 10) {
                    molins.splice(i, 1);
                    perdreVida();
                }

                // Col·lisió Llança
                llances.forEach((l, li) => {
                    if (l.x < m.x + m.w && l.x + l.w > m.x && l.y < m.y + m.h && l.y + l.h > m.y) {
                        molins.splice(i, 1);
                        llances.splice(li, 1);
                        puntuacio += 5;
                        document.getElementById("val-punts").innerText = puntuacio;
                    }
                });
            });

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Dibuixar fons (Terra)
            ctx.fillStyle = "#8b4513";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

            dibuixarQuixot(quixot.x, quixot.y);
            
            ctx.fillStyle = "#ef4444";
            llances.forEach(l => {
                ctx.beginPath();
                ctx.roundRect(l.x, l.y, l.w, l.h, 5);
                ctx.fill();
            });
            
            molins.forEach(m => dibuixarMoli(m));

            requestAnimationFrame(bucle);
        }

        bucle();
    </script>
</body>
</html>
