<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quixot Mobile</title>
    
    <!-- Icones del Quixot -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/512/8b4513/don-quixote.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/512/8b4513/don-quixote.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#fef3c7">

    <style>
        /* CSS PUR - Molt resistent */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #fef3c7; font-family: sans-serif; }
        #wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        
        header { height: 60px; background: #8b4513; color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; box-sizing: border-box; }
        header p { margin: 0; font-size: 10px; text-transform: uppercase; color: #fde68a; font-weight: bold; }
        header span { font-size: 20px; font-weight: 900; }

        #jocCanvas { flex-grow: 1; background-color: #bae6fd; width: 100%; touch-action: none; }

        footer { height: 140px; background: #78350f; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 15px; box-sizing: border-box; }
        .btn { background: #92400e; border-radius: 15px; border: none; color: white; font-size: 35px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .btn:active { background: #b45309; }
        .btn-foc { background: #dc2626; border-radius: 50%; box-shadow: 0 5px 0 #991b1b; }
        .btn-foc:active { transform: translateY(3px); box-shadow: 0 2px 0 #991b1b; }

        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); color: white; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .final-box { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; margin: 20px 0; width: 250px; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div id="wrapper">
        <header>
            <div><p>Punts</p><span id="val-punts">0</span></div>
            <div id="val-vides" style="font-size: 20px;">❤️❤️❤️</div>
            <div style="text-align: right;"><p>Rècord</p><span id="val-record">0</span></div>
        </header>

        <canvas id="jocCanvas"></canvas>

        <footer>
            <button class="btn" id="moure-esq">⬅️</button>
            <button class="btn btn-foc" id="disparar">🔥</button>
            <button class="btn" id="moure-dre">➡️</button>
        </footer>
    </div>

    <div id="overlay">
        <h2 style="font-size: 40px; margin: 0; font-style: italic;">GAME OVER</h2>
        <div class="final-box">
            <p style="font-size: 12px; color: #fbbf24; margin: 0;">PUNTUACIÓ</p>
            <p id="punts-finals" style="font-size: 45px; font-weight: 900; margin: 5px 0;">0</p>
            <p style="font-size: 10px; color: #94a3b8; margin: 0;">MILLOR RÈCORD</p>
            <p id="record-final" style="font-size: 20px; margin: 0;">0</p>
        </div>
        <button onclick="reiniciar()" style="background: #2563eb; color: white; border: none; padding: 15px 40px; border-radius: 15px; font-weight: bold; font-size: 18px; cursor: pointer;">REINTENTAR</button>
    </div>

    <script>
        const canvas = document.getElementById("jocCanvas");
        const ctx = canvas.getContext("2d");
        const overlay = document.getElementById("overlay");

        let puntuacio = 0;
        let vides = 3;
        let jocActiu = true;
        let record = localStorage.getItem("quixot_v3_record") || 0;
        document.getElementById("val-record").innerText = record;

        // Ajustar resolució interna del canvas
        function ajustarMida() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', ajustarMida);
        setTimeout(ajustarMida, 100);

        const quixot = { x: 100, y: 0, w: 60, h: 60, vel: 7, esq: false, dre: false };
        let llances = [];
        let molins = [];

        // Controls
        document.getElementById("moure-esq").onpointerdown = () => quixot.esq = true;
        document.getElementById("moure-esq").onpointerup = () => quixot.esq = false;
        document.getElementById("moure-dre").onpointerdown = () => quixot.dre = true;
        document.getElementById("moure-dre").onpointerup = () => quixot.dre = false;
        document.getElementById("disparar").onclick = llançar;

        function llançar() {
            if (!jocActiu) return;
            llances.push({ x: quixot.x + 15, y: quixot.y, w: 20, h: 40 });
        }

        function perdreVida() {
            vides--;
            document.getElementById("val-vides").innerText = "❤️".repeat(vides);
            if (vides <= 0) finalitzarJoc();
        }

        function finalitzarJoc() {
            jocActiu = false;
            if (puntuacio > record) {
                record = puntuacio;
                localStorage.setItem("quixot_v3_record", record);
            }
            document.getElementById("punts-finals").innerText = puntuacio;
            document.getElementById("record-final").innerText = record;
            overlay.style.display = "flex";
        }

        function reiniciar() {
            puntuacio = 0; vides = 3; llances = []; molins = [];
            document.getElementById("val-punts").innerText = "0";
            document.getElementById("val-vides").innerText = "❤️❤️❤️";
            document.getElementById("val-record").innerText = record;
            overlay.style.display = "none";
            jocActiu = true;
            bucle();
        }

        function bucle() {
            if (!jocActiu) return;

            // Actualitzar posició Quixot
            quixot.y = canvas.height - 80;
            if (quixot.esq && quixot.x > 0) quixot.x -= quixot.vel;
            if (quixot.dre && quixot.x < canvas.width - quixot.w) quixot.x += quixot.vel;

            // Crear molins
            if (Math.random() < 0.03) {
                molins.push({ x: Math.random() * (canvas.width - 50), y: -60, w: 55, h: 55, v: 3 + Math.random() * 3 });
            }

            // Moure llances
            llances.forEach((l, i) => {
                l.y -= 8;
                if (l.y < -50) llances.splice(i, 1);
            });

            // Moure molins i col·lisions
            molins.forEach((m, i) => {
                m.y += m.v;
                
                // Toca terra
                if (m.y > canvas.height) molins.splice(i, 1);

                // Toca Quixot
                if (m.y + m.h > quixot.y + 10 && m.x < quixot.x + quixot.w - 10 && m.x + m.w > quixot.x + 10) {
                    molins.splice(i, 1);
                    perdreVida();
                }

                // Toca Llanca
                llances.forEach((l, li) => {
                    if (l.x < m.x + m.w && l.x + l.w > m.x && l.y < m.y + m.h && l.y + l.h > m.y) {
                        molins.splice(i, 1);
                        llances.splice(li, 1);
                        puntuacio += 5;
                        document.getElementById("val-punts").innerText = puntuacio;
                    }
                });
            });

            // DIBUIXAR
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = "60px Arial";
            ctx.fillText("🏇", quixot.x, quixot.y + 50);
            
            ctx.font = "30px Arial";
            llances.forEach(l => ctx.fillText("📍", l.x, l.y + 30));
            
            ctx.font = "60px Arial";
            molins.forEach(m => ctx.fillText("🎡", m.x, m.y + 50));

            requestAnimationFrame(bucle);
        }

        // Inici
        ajustarMida();
        bucle();
    </script>
</body>
</html>
